<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Compendio de Gobierno · Leer en línea</title>
  <meta name="description" content="Visor en línea, con índice y buscador, del compendio normativo de Gobierno, Descentralización y Regionalización de Chile.">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="visor.css">
  <script>
    try {
      const tema = localStorage.getItem("visor-tema");
      if (tema) document.documentElement.dataset.theme = tema;
    } catch (e) {}
  </script>
  <script type="module" src="visor.js"></script>
</head>
<body>
  <div class="progreso" id="progreso" role="progressbar" aria-label="Carga del documento"><span></span></div>

  <header class="barra">
    <div class="marca">
      <button type="button" class="icono" id="alternar-indice" aria-controls="indice-panel" aria-expanded="true" title="Índice">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        <span class="sr">Mostrar u ocultar el índice</span>
      </button>
      <div class="marca-texto">
        <span class="marca-titulo" id="titulo">Compendio de Gobierno, Descentralización y Regionalización</span>
        <span class="marca-ubicacion" id="ubicacion" aria-live="polite"></span>
      </div>
    </div>

    <form class="buscador" id="buscador" role="search">
      <svg class="lupa" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="consulta" type="search" placeholder="Buscar en todo el compendio" autocomplete="off" spellcheck="false" aria-label="Buscar en el compendio" aria-controls="resultados-panel">
      <span class="contador" id="contador" aria-live="polite"></span>
      <button type="button" class="icono chico" id="anterior" title="Anterior (Mayús+Enter)" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg><span class="sr">Anterior</span>
      </button>
      <button type="button" class="icono chico" id="siguiente" title="Siguiente (Enter)" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span class="sr">Siguiente</span>
      </button>
      <kbd class="atajo" aria-hidden="true">Ctrl F</kbd>
    </form>

    <div class="herramientas">
      <label class="pastilla pagina" title="Ir a la página">
        <span class="sr">Página</span>
        <input id="pagina" type="text" inputmode="numeric" value="1" aria-label="Página actual">
        <span id="total-paginas">/ …</span>
      </label>
      <div class="pastilla zoom" role="group" aria-label="Tamaño">
        <button type="button" class="icono chico" id="alejar" title="Alejar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg><span class="sr">Alejar</span>
        </button>
        <button type="button" class="escala" id="escala" title="Ajustar al ancho">Ancho</button>
        <button type="button" class="icono chico" id="acercar" title="Acercar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg><span class="sr">Acercar</span>
        </button>
      </div>
      <button type="button" class="icono" id="tema" title="Cambiar tema">
        <svg class="sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
        <span class="sr">Cambiar entre tema claro y oscuro</span>
      </button>
      <a class="boton-primario" id="descargar" href="https://github.com/n-a-monterocarvajal/Compendio-Normativo-Gobierno-Descentralizacion-y-Regionalizacion-Chile/releases/latest" title="Descargar el PDF">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        <span class="texto-boton">PDF</span>
      </a>
    </div>
  </header>

  <div class="cuerpo">
    <aside class="lateral indice-panel" id="indice-panel" aria-label="Índice">
      <div class="asa" aria-hidden="true"></div>
      <div class="lateral-cabecera">
        <h2>Índice</h2>
        <button type="button" class="icono chico solo-movil" data-cerrar="indice" title="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg><span class="sr">Cerrar</span>
        </button>
      </div>
      <div class="filtro">
        <input id="filtro-indice" type="search" placeholder="Filtrar normas" autocomplete="off" aria-label="Filtrar normas del índice">
      </div>
      <nav id="indice" class="indice" aria-label="Índice del compendio"><p class="aviso">Cargando índice…</p></nav>
      <footer class="pie" id="pie"></footer>
    </aside>

    <main class="lienzo">
      <div id="contenedor-visor" class="contenedor-visor" tabindex="0">
        <div id="visor" class="pdfViewer"></div>
      </div>
      <div class="aviso-carga" id="aviso-carga" role="status">Abriendo el compendio…</div>
    </main>

    <aside class="lateral resultados-panel" id="resultados-panel" aria-label="Resultados de búsqueda" hidden>
      <div class="asa" aria-hidden="true"></div>
      <div class="lateral-cabecera">
        <h2 id="estado-busqueda" aria-live="polite">Resultados</h2>
        <button type="button" class="icono chico" data-cerrar="resultados" title="Cerrar resultados">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg><span class="sr">Cerrar</span>
        </button>
      </div>
      <div class="opciones" role="group" aria-label="Opciones de búsqueda">
        <div class="segmentado" role="radiogroup" aria-label="Alcance">
          <button type="button" role="radio" aria-checked="true" data-alcance="todo">Todo</button>
          <button type="button" role="radio" aria-checked="false" data-alcance="norma">Esta norma</button>
        </div>
        <button type="button" class="chip" id="palabra-completa" aria-pressed="false">Palabra completa</button>
      </div>
      <ol class="resultados" id="resultados"></ol>
    </aside>
  </div>

  <div class="velo" id="velo" hidden></div>
</body>
</html>
